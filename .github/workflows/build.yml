name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Analyze + test: har push par chalta hai. Builds se alag hai (fail ho to bhi APK/iOS build chalte hain),
  # lekin result GitHub Actions mein dekhein.
  analyze-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter pub get

      # Sirf errors/warnings fail karte hain; info-level lints nahi.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Repo has no ios/ or android/ folders, so generate them.
      - run: flutter create --platforms=ios,android --project-name ah_developer_kiryana_store .

      # App ka naam (home screen par): Hanna Solutions.
      - name: Set iOS app name
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Hanna Solutions'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 'Hanna Solutions'" ios/Runner/Info.plist

      # Firebase needs iOS 13+ and google_mlkit_* (Bill Scan OCR) needs iOS 15.5+; Flutter's template defaults to 12.
      - name: Set iOS deployment target to 15.5
        run: |
          sed -i '' "s/^# platform :ios.*/platform :ios, '15.5'/" ios/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 12.0/IPHONEOS_DEPLOYMENT_TARGET = 15.5/g" ios/Runner.xcodeproj/project.pbxproj

      # Pods (e.g. resource bundles) otherwise ask for a Development Team even with --no-codesign.
      - name: Disable code signing for Pods
        run: |
          perl -0pi -e 's/(flutter_additional_ios_build_settings\(target\)\n)/$1    target.build_configurations.each do |c|\n      c.build_settings["CODE_SIGNING_ALLOWED"] = "NO"\n      c.build_settings["CODE_SIGNING_REQUIRED"] = "NO"\n      c.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""\n    end\n/' ios/Podfile
          grep -n "CODE_SIGN" ios/Podfile

      - run: flutter pub get

      # Unsigned build — good enough to confirm it compiles for iOS.
      # To install on a real iPad you need a signed IPA: open ios/Runner.xcworkspace
      # in Xcode on a Mac, set your Apple Developer team under Signing & Capabilities,
      # then Product > Archive (or use TestFlight for wider distribution).
      - run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter create --platforms=ios,android --project-name ah_developer_kiryana_store .

      # Firebase auth 23.x needs Kotlin 2.1+.
      - name: Bump Kotlin plugin
        run: sed -i -E 's/(org.jetbrains.kotlin.android" version )"[0-9.]+"/\1"2.1.0"/' android/settings.gradle

      - run: flutter pub get

      - name: Android fixes + fixed signing key
        run: bash tools/android_fix.sh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Har build ka versionCode badhta hai, taake Android use update maane.
      # Gradle signing passwords System.getenv() se padhta hai, isliye yahan bhi env zaroori hai.
      - run: flutter build apk --release --build-number=${{ github.run_number }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows (exe)
    # windows-latest ab Visual Studio 2026 wala hai; Flutter 3.24.0 use nahi pehchanta
    # ("Generator Visual Studio 16 2019 could not find any instance"). windows-2022 mein VS 2022 hai.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Repo mein windows/ folder nahi hota, isliye generate karte hain (iOS / Android jaisa).
      - run: flutter create --platforms=windows --project-name ah_developer_kiryana_store .

      - run: flutter pub get

      # Window title: Hanna Solutions.
      - name: Set Windows window title
        shell: pwsh
        run: (Get-Content windows/runner/main.cpp) -replace 'L"ah_developer_kiryana_store"', 'L"Hanna Solutions"' | Set-Content windows/runner/main.cpp

      - run: flutter build windows --release

      # Poora Release folder (exe + dll + data) — sirf .exe akeli nahi chalti.
      - name: Zip Release folder
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath AH-Kiryana-Store-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: AH-Kiryana-Store-windows.zip
