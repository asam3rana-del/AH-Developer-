name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Repo has no ios/ or android/ folders, so generate them.
      - run: flutter create --platforms=ios,android --project-name ah_developer_kiryana_store .

      # Firebase plugins need iOS 13+; Flutter's template defaults to 12.
      - name: Set iOS deployment target to 13.0
        run: |
          sed -i '' "s/^# platform :ios.*/platform :ios, '13.0'/" ios/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 12.0/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g" ios/Runner.xcodeproj/project.pbxproj

      # Pods (e.g. resource bundles) otherwise ask for a Development Team even with --no-codesign.
      - name: Disable code signing for Pods
        run: |
          perl -0pi -e 's/(flutter_additional_ios_build_settings\(target\)\n)/$1    target.build_configurations.each do |c|\n      c.build_settings["CODE_SIGNING_ALLOWED"] = "NO"\n      c.build_settings["CODE_SIGNING_REQUIRED"] = "NO"\n      c.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""\n    end\n/' ios/Podfile
          grep -n "CODE_SIGN" ios/Podfile

      - run: flutter pub get

      # Unsigned build — good enough to confirm it compiles for iOS.
      # To install on a real iPad you need a signed IPA: open ios/Runner.xcworkspace
      # in Xcode on a Mac, set your Apple Developer team under Signing & Capabilities,
      # then Product > Archive (or use TestFlight for wider distribution).
      - run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter create --platforms=ios,android --project-name ah_developer_kiryana_store .

      # Firebase needs Kotlin 1.9+; Flutter 3.24's template pins 1.7.10.
      - name: Bump Kotlin plugin
        run: sed -i -E 's/(org.jetbrains.kotlin.android" version )"[0-9.]+"/\1"1.9.24"/' android/settings.gradle

      - run: flutter pub get
      - run: bash tools/android_fix.sh
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
