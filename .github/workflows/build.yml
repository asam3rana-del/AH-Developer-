name: Build

on:
  push:
    branches: [ main ]
    # Sirf docs/markdown badalne par build (aur Actions ke minutes) zaya na hon.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version (khali = neeche wala FLUTTER_VERSION). Naya version aazmane ke liye e.g. 3.50.x'
        required: false
        default: ''
      accept_new_lockfile:
        description: 'pubspec.yaml badla hai aur nayi pubspec.lock abhi commit nahi hui: is run mein lock check skip (artifact "pubspec-lock" download karke commit karein)'
        type: boolean
        required: false
        default: false

# Naya push aane par usi branch ki purani chalti run cancel (build minutes bachte hain).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flutter ka ek hi version, saari jobs ke liye. Bump karna ho to sirf yeh ek line badlein
  # (ya Run workflow mein flutter_version likhein) — naye Flutter par Android/iOS/Windows
  # build ke fixes (tools/android_fix.sh, Kotlin/AGP/Gradle versions) dobara check karne parte hain.
  # 3.47.x = latest 3.47 patch (Play Store API 36 / Android 16 ke saath). 3.24 -> 3.47 upgrade: 2026-11-10.
  FLUTTER_VERSION: ${{ inputs.flutter_version || '3.47.x' }}
  ACCEPT_NEW_LOCK: ${{ inputs.accept_new_lockfile && '1' || '0' }}

jobs:
  # Analyze + test is the required release gate. Every platform build depends on this job.
  analyze-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: flutter pub get (lockfile check)
        shell: bash
        run: |
          flutter pub get
          if [ ! -f pubspec.lock ]; then
            echo "::error::pubspec.lock is missing. Commit it to the repository root."
            exit 1
          elif ! git diff --quiet --ignore-cr-at-eol -- pubspec.lock; then
            if [ "$ACCEPT_NEW_LOCK" = "1" ]; then
              echo "::warning::pubspec.lock badli (accept_new_lockfile=true). Artifact 'pubspec-lock' download karke repo mein commit karein."
            else
              echo "::error::pubspec.lock is out of date with pubspec.yaml. Run 'flutter pub get' and commit the updated lockfile (ya Run workflow mein accept_new_lockfile tick karein)."
              git diff -- pubspec.lock | head -50
              exit 1
            fi
          fi

      # CI ne jo pubspec.lock banayi, wo download ke liye rakh do (repo mein commit karne ke liye).
      - name: Upload generated pubspec.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: pubspec.lock
          if-no-files-found: warn

      # Sirf errors/warnings fail karte hain; info-level lints nahi.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Release gate: missing tests are a configuration error, not a silent skip.
      - name: Verify test suite exists
        run: |
          if [ ! -d test ] || [ -z "$(find test -name '*_test.dart' -print -quit)" ]; then
            echo "::error::No Dart tests found. Release builds are blocked until the test suite is restored."
            exit 1
          fi

      - name: flutter test
        run: flutter test --reporter expanded

  build-ios:
    name: Build iOS (unsigned)
    needs: analyze-test
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # workmanager_apple 0.9.4+ iOS 26 ke APIs (BGContinuedProcessingTask) use karta hai — Xcode 26 SDK zaroori.
      # macos-15 runner ka default Xcode 16 hai; wahan install shuda sab se naya Xcode 26 chuno.
      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then
            echo "::error::Runner par Xcode 26 nahi mila. Maujood:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$X"
          xcodebuild -version

      # Flutter 3.44+ mein Swift Package Manager default hai; kuch plugins (mlkit, bluetooth printer) abhi
      # CocoaPods par hain aur neeche ke Podfile steps CocoaPods maante hain — is liye CI mein purana raasta.
      - run: flutter config --no-enable-swift-package-manager

      # Repo has no ios/ or android/ folders, so generate them.
      # App ID: Android tools/android_fix.sh mein, iOS neeche "Set iOS app name" step mein (com.hannasolutions.pos).
      - run: flutter create --platforms=ios,android --project-name ah_developer_kiryana_store .

      # Flutter 3.47 ka `flutter create` dependencies naye patch par upgrade kar deta hai — commit wali lock wapas.
      - run: git checkout -- pubspec.yaml pubspec.lock

      # App icon: Hanna Software Series ka POS icon. AppIcon.appiconset ki har PNG ko usi pixel size wali
      # app_icon/ios/icon_<px>.png se badal do (file naam Flutter template ke hi rehte hain).
      - name: Set iOS app icon (Hanna POS)
        run: |
          set -e
          SET=ios/Runner/Assets.xcassets/AppIcon.appiconset
          for f in "$SET"/*.png; do
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
            src="app_icon/ios/icon_${w}.png"
            [ -f "$src" ] || { echo "::error::$src nahi mila ($f)"; exit 1; }
            cp "$src" "$f"
          done
          ls -la "$SET"

      # App ka naam (home screen par): Hanna POS.
      - name: Set iOS app name
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Hanna POS'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 'Hanna POS'" ios/Runner/Info.plist
          # App ID (bundle identifier) — Android ke saath ek jaisa. Kabhi na badlein.
          sed -i '' -E 's/PRODUCT_BUNDLE_IDENTIFIER = com\.example\.[A-Za-z0-9_]+/PRODUCT_BUNDLE_IDENTIFIER = com.hannasolutions.pos/g' ios/Runner.xcodeproj/project.pbxproj
          grep -m3 "PRODUCT_BUNDLE_IDENTIFIER" ios/Runner.xcodeproj/project.pbxproj
          ! grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.example" ios/Runner.xcodeproj/project.pbxproj || { echo "::error::iOS bundle id nahi badla"; exit 1; }

      # iOS privacy strings: inke baghair camera (Bill Scan), gallery, contacts (party phone), Face ID
      # (fingerprint login) ya Bluetooth printer kholte hi iOS app ko foran band (crash) kar deta hai,
      # aur App Store review bhi reject karta hai.
      - name: Set iOS usage descriptions
        run: |
          P=ios/Runner/Info.plist
          add() { /usr/libexec/PlistBuddy -c "Delete :$1" "$P" 2>/dev/null || true; /usr/libexec/PlistBuddy -c "Add :$1 string '$2'" "$P"; }
          add NSCameraUsageDescription "Bill scan karne ke liye camera chahiye."
          add NSPhotoLibraryUsageDescription "Bill ki tasveer gallery se chunne ke liye."
          add NSContactsUsageDescription "Party ka phone number contacts se bharne ke liye."
          add NSFaceIDUsageDescription "Face ID se login aur app lock ke liye."
          add NSBluetoothAlwaysUsageDescription "Bluetooth bill printer se print karne ke liye."
          add NSBluetoothPeripheralUsageDescription "Bluetooth bill printer se print karne ke liye."
          add NSLocalNetworkUsageDescription "WiFi / network bill printer se print karne ke liye."
          grep -c "UsageDescription" "$P"

      # google_mlkit_* (Bill Scan OCR) needs iOS 15.5+; Flutter 3.47 ka template minimum 15.0 hai.
      - name: Set iOS deployment target to 15.5
        run: |
          [ -f ios/Podfile ] || { echo "::error::ios/Podfile nahi bani (SPM band hona chahiye tha)"; exit 1; }
          sed -i '' -E "s/^#? *platform :ios.*/platform :ios, '15.5'/" ios/Podfile
          sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g" ios/Runner.xcodeproj/project.pbxproj
          grep -m3 "IPHONEOS_DEPLOYMENT_TARGET" ios/Runner.xcodeproj/project.pbxproj

      # Pods (e.g. resource bundles) otherwise ask for a Development Team even with --no-codesign.
      - name: Disable code signing for Pods
        run: |
          perl -0pi -e 's/(flutter_additional_ios_build_settings\(target\)\n)/$1    target.build_configurations.each do |c|\n      c.build_settings["CODE_SIGNING_ALLOWED"] = "NO"\n      c.build_settings["CODE_SIGNING_REQUIRED"] = "NO"\n      c.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""\n    end\n/' ios/Podfile
          grep -n "CODE_SIGN" ios/Podfile

      - name: flutter pub get (lockfile check)
        shell: bash
        run: |
          flutter pub get
          if [ ! -f pubspec.lock ]; then
            echo "::error::pubspec.lock is missing. Commit it to the repository root."
            exit 1
          elif ! git diff --quiet --ignore-cr-at-eol -- pubspec.lock; then
            if [ "$ACCEPT_NEW_LOCK" = "1" ]; then
              echo "::warning::pubspec.lock badli (accept_new_lockfile=true). Artifact 'pubspec-lock' download karke repo mein commit karein."
            else
              echo "::error::pubspec.lock is out of date with pubspec.yaml. Run 'flutter pub get' and commit the updated lockfile (ya Run workflow mein accept_new_lockfile tick karein)."
              git diff -- pubspec.lock | head -50
              exit 1
            fi
          fi

      # Unsigned build — good enough to confirm it compiles for iOS.
      # To install on a real iPad you need a signed IPA: open ios/Runner.xcworkspace
      # in Xcode on a Mac, set your Apple Developer team under Signing & Capabilities,
      # then Product > Archive (or use TestFlight for wider distribution).
      - run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v7
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app

  build-android:
    name: Build Android APK
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # Gradle 8.9 / AGP 8.7.3 ke liye JDK 17 pakka (runner ka default Java badal jaye to "Gradle version incompatible with Java" error aata hai).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # App ID: Android tools/android_fix.sh mein, iOS neeche "Set iOS app name" step mein (com.hannasolutions.pos).
      - run: flutter create --platforms=ios,android --project-name ah_developer_kiryana_store .

      # Flutter 3.47 ka `flutter create` dependencies naye patch par upgrade kar deta hai — commit wali lock wapas.
      - run: git checkout -- pubspec.yaml pubspec.lock

      # Kotlin / AGP / targetSdk: tools/android_fix.sh (Groovy aur naya KTS template dono).

      - name: flutter pub get (lockfile check)
        shell: bash
        run: |
          flutter pub get
          if [ ! -f pubspec.lock ]; then
            echo "::error::pubspec.lock is missing. Commit it to the repository root."
            exit 1
          elif ! git diff --quiet --ignore-cr-at-eol -- pubspec.lock; then
            if [ "$ACCEPT_NEW_LOCK" = "1" ]; then
              echo "::warning::pubspec.lock badli (accept_new_lockfile=true). Artifact 'pubspec-lock' download karke repo mein commit karein."
            else
              echo "::error::pubspec.lock is out of date with pubspec.yaml. Run 'flutter pub get' and commit the updated lockfile (ya Run workflow mein accept_new_lockfile tick karein)."
              git diff -- pubspec.lock | head -50
              exit 1
            fi
          fi

      - name: Android fixes + fixed signing key
        run: bash tools/android_fix.sh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # App icon: Hanna Software Series ka POS icon (app_icon/hanna_pos_icon.svg se bane PNG).
      # Purane phones: mipmap-*/ic_launcher.png. Android 8+: adaptive icon (navy background + H/barcode foreground).
      - name: Set Android app icon (Hanna POS)
        run: |
          set -e
          RES=android/app/src/main/res
          cp -R app_icon/android/. "$RES/"
          rm -f "$RES"/mipmap-anydpi-v26/ic_launcher_round.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml || { echo "::error::Manifest mein @mipmap/ic_launcher nahi"; exit 1; }
          ls "$RES"/mipmap-*

      # Har build ka versionCode badhta hai, taake Android use update maane.
      # Gradle signing passwords System.getenv() se padhta hai, isliye yahan bhi env zaroori hai.
      - run: flutter build apk --release --build-number=${{ github.run_number }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Google Play sirf Android App Bundle (.aab) leta hai. Wahi signing key (upload key) se.
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-windows:
    name: Build Windows (exe)
    needs: analyze-test
    # windows-latest ab Visual Studio 2026 wala hai; Flutter 3.24.0 use nahi pehchanta
    # ("Generator Visual Studio 16 2019 could not find any instance"). windows-2022 mein VS 2022 hai.
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # Repo mein windows/ folder nahi hota, isliye generate karte hain (iOS / Android jaisa).
      - run: flutter create --platforms=windows --project-name ah_developer_kiryana_store .

      # Flutter 3.47 ka `flutter create` dependencies naye patch par upgrade kar deta hai — commit wali lock wapas.
      - run: git checkout -- pubspec.yaml pubspec.lock
        shell: bash

      - name: flutter pub get (lockfile check)
        shell: bash
        run: |
          flutter pub get
          if [ ! -f pubspec.lock ]; then
            echo "::error::pubspec.lock is missing. Commit it to the repository root."
            exit 1
          elif ! git diff --quiet --ignore-cr-at-eol -- pubspec.lock; then
            if [ "$ACCEPT_NEW_LOCK" = "1" ]; then
              echo "::warning::pubspec.lock badli (accept_new_lockfile=true). Artifact 'pubspec-lock' download karke repo mein commit karein."
            else
              echo "::error::pubspec.lock is out of date with pubspec.yaml. Run 'flutter pub get' and commit the updated lockfile (ya Run workflow mein accept_new_lockfile tick karein)."
              git diff -- pubspec.lock | head -50
              exit 1
            fi
          fi

      # Windows runner ki tayyari (flutter create ke banaye hue files par):
      #  1. Window title "Hanna POS", maximized khulti hai (restore = 1280x800).
      #  2. Ek waqt mein sirf EK app: dusri dafa kholne par purani window aage aa jaye
      #     (do copies ek hi SQLite DB par likhein to hisaab / sync bigar sakta hai).
      #  3. Hanna POS icon (windows_assets/app_icon.ico = app_icon/hanna_pos_icon.svg).
      #  4. Runner.rc: CompanyName / ProductName. path_provider inhi se AppData folder banata hai:
      #     %APPDATA%\Hanna Solutions\Hanna POS  (DB + settings). KABHI NA BADLEIN — badla to data "gum" lagega.
      #     (purana com.example wala folder lib/db/desktop_db_init.dart khud naye mein copy kar deta hai.)
      - name: Windows runner setup (title, single instance, icon, company name)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $main = 'windows/runner/main.cpp'
          $c = Get-Content $main -Raw
          $c = $c -replace 'L"ah_developer_kiryana_store"', 'L"Hanna POS"'
          $c = $c -replace 'Win32Window::Size size\(\d+, \d+\)', 'Win32Window::Size size(1280, 800)'
          $guard = @'
          $1
            // Hanna POS: sirf ek instance. Dusri dafa kholne par pehli window aage le aao.
            HANDLE hanna_single = ::CreateMutexW(nullptr, TRUE, L"Local\\HannaPOS_SingleInstance");
            if (hanna_single != nullptr && ::GetLastError() == ERROR_ALREADY_EXISTS) {
              HWND existing = ::FindWindowW(L"FLUTTER_RUNNER_WIN32_WINDOW", L"Hanna POS");
              if (existing != nullptr) {
                if (::IsIconic(existing)) ::ShowWindow(existing, SW_RESTORE);
                ::SetForegroundWindow(existing);
              }
              return EXIT_SUCCESS;
            }
          '@
          $c = [regex]::new('(show_command\)\s*\{)').Replace($c, $guard, 1)
          Set-Content $main $c -NoNewline
          foreach ($must in 'L"Hanna POS"', 'HannaPOS_SingleInstance', 'size(1280, 800)') {
            if (-not (Select-String -Path $main -SimpleMatch $must -Quiet)) { Write-Error "main.cpp patch fail: $must" }
          }

          # App poori screen (maximized) khule — POS PC par yehi chahiye. Restore karne par 1280x800.
          $fw = 'windows/runner/flutter_window.cpp'
          $f = Get-Content $fw -Raw
          if ($f -match 'this->Show\(\);') {
            $f = $f -replace 'this->Show\(\);', '::ShowWindow(this->GetHandle(), SW_SHOWMAXIMIZED);'
            Set-Content $fw $f -NoNewline
          } else {
            Write-Warning "flutter_window.cpp mein this->Show() nahi mila — window maximized nahi khulegi"
          }

          Copy-Item windows_assets/app_icon.ico windows/runner/resources/app_icon.ico -Force

          $rc = 'windows/runner/Runner.rc'
          $r = Get-Content $rc -Raw
          $r = $r -replace 'VALUE "CompanyName", "[^"]*"', 'VALUE "CompanyName", "Hanna Solutions"'
          $r = $r -replace 'VALUE "ProductName", "[^"]*"', 'VALUE "ProductName", "Hanna POS"'
          $r = $r -replace 'VALUE "FileDescription", "[^"]*"', 'VALUE "FileDescription", "Hanna POS"'
          $r = $r -replace 'VALUE "LegalCopyright", "[^"]*"', 'VALUE "LegalCopyright", "Copyright (C) Hanna Solutions"'
          Set-Content $rc $r -NoNewline
          foreach ($must in '"CompanyName", "Hanna Solutions"', '"ProductName", "Hanna POS"') {
            if (-not (Select-String -Path $rc -SimpleMatch $must -Quiet)) { Write-Error "Runner.rc patch fail: $must" }
          }
          Select-String -Path $rc -Pattern 'CompanyName|ProductName|FileDescription'

      - run: flutter build windows --release

      # Naye PC par "VCRUNTIME140_1.dll / MSVCP140.dll was not found" na aaye:
      # Visual C++ 2015-2022 runtime DLLs exe ke saath hi rakh do (app-local deployment, Flutter docs wala tareeqa).
      # Backup ke liye vc_redist.x64.exe bhi zip mein — agar kabhi DLL wala raasta kaam na kare.
      - name: Bundle Visual C++ runtime (VC++ 2015-2022 x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = "build/windows/x64/runner/Release"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { Write-Error "Visual Studio (C++ tools) runner par nahi mila" }
          Write-Host "Visual Studio: $vs"

          # VC\Redist\MSVC\<version>\x64\Microsoft.VC14x.CRT  (sab se naya version)
          $verDir = Get-ChildItem (Join-Path $vs "VC\Redist\MSVC") -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $crt = Get-ChildItem (Join-Path $verDir.FullName "x64") -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if (-not $crt) { Write-Error "Microsoft.VC*.CRT folder nahi mila ($($verDir.FullName))" }
          Write-Host "CRT: $($crt.FullName)"
          Copy-Item (Join-Path $crt.FullName "*.dll") $rel -Force

          $redist = Join-Path $verDir.FullName "vc_redist.x64.exe"
          if (Test-Path $redist) { Copy-Item $redist $rel -Force } else { Write-Warning "vc_redist.x64.exe nahi mila (sirf DLLs bundle hongi)" }

          @"
          Hanna POS - Windows
          ===================
          1. Poora zip kisi folder mein Extract karein (zip ke andar se exe na chalayein).
          2. ah_developer_kiryana_store.exe chalayein.
          3. Agar phir bhi 'VCRUNTIME140 / MSVCP140 .dll not found' aaye to isi folder ka
             vc_redist.x64.exe ek dafa install karein, phir app dobara kholein.
          Windows 10/11 64-bit zaroori hai.
          "@ | Set-Content (Join-Path $rel "PEHLE_PARHEIN.txt") -Encoding UTF8

      # Check: exe aur har plugin DLL jo bhi MSVC runtime DLL mangti hai, wo Release folder mein maujood ho.
      # (api-ms-win-crt-* Windows 10/11 ke andar hi hoti hain, unhein nahi dekhte.)
      - name: Verify no missing VC++ runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = "build/windows/x64/runner/Release"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem (Join-Path $vs "VC\Tools\MSVC") -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $present = (Get-ChildItem $rel -Filter *.dll).Name | ForEach-Object { $_.ToLower() }
          $missing = @()
          Get-ChildItem $rel -Include *.exe,*.dll -Recurse | ForEach-Object {
            $deps = & $dumpbin.FullName /nologo /dependents $_.FullName |
              ForEach-Object { $_.Trim().ToLower() } |
              Where-Object { $_ -match '^(vcruntime|msvcp|concrt|vcomp|vccorlib)\S*\.dll$' }
            foreach ($d in $deps) {
              if ($present -notcontains $d) { $missing += "$($_.Name) -> $d" }
            }
          }
          Get-ChildItem $rel | Format-Table Name, Length
          if ($missing.Count) { $missing | Sort-Object -Unique | ForEach-Object { Write-Host "::error::Missing: $_" }; exit 1 }
          Write-Host "OK: saari VC++ runtime DLLs Release folder mein hain."

      # Poora Release folder (exe + dll + data) — sirf .exe akeli nahi chalti.
      - name: Zip Release folder
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath AH-Kiryana-Store-windows.zip

      # Asaan install: HannaPOS-Setup-<version>.exe — Start menu + Desktop shortcut, admin ki zaroorat nahi,
      # update ke waqt data (AppData) mehfooz. Inno Setup windows-2022 runner par pehle se hota hai.
      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value)
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $src = (Resolve-Path build/windows/x64/runner/Release).Path
          $out = Join-Path $PWD 'installer_out'
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$src" "/DOutDir=$out" windows_assets/installer.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup fail ($LASTEXITCODE)" }
          Get-ChildItem $out

      - uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            AH-Kiryana-Store-windows.zip
            installer_out/HannaPOS-Setup-*.exe
