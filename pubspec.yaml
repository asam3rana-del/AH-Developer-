name: ah_developer_kiryana_store
description: "AH Developer Kiryana Store — cross-platform POS (Android + iPad/iOS), ported from the IBTISAAM Kiryana Store Kotlin app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local database (mirrors the Room/SQLite schema from Database.kt)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Cloud sync (mirrors SyncApi.kt / SyncRepository.kt — Firestore backend)
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1

  # Misc
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
