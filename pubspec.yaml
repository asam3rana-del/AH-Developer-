name: ah_developer_kiryana_store
description: "AH Developer Kiryana Store — cross-platform POS (Android + iPad/iOS), ported from the IBTISAAM Kiryana Store Kotlin app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local database (mirrors the Room/SQLite schema from Database.kt)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  # Windows (desktop): sqflite wahan nahi chalta — FFI wala SQLite + sqlite3.dll bundle.
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24

  # Cloud sync (mirrors SyncApi.kt / SyncRepository.kt — Firestore backend)
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.0       # SyncApi: anonymous sign-in (Firestore rules request.auth != null)
  connectivity_plus: ^6.0.3   # NetworkMonitor: internet wapas aane par sync trigger
  flutter_foreground_task: ^8.10.0  # Android: minimize/back ke baad bhi sync chalti rahe (SyncKeepAlive)

  # Misc
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  local_auth: ^2.3.0   # fingerprint (AppLock / Login / Manage Users)
  crypto: ^3.0.3
  uuid: ^4.4.0
  url_launcher: ^6.3.0  # Party screen: Call (tel:)

  # Phase 11 — Backup / Export (Kotlin: BackupCrypto, BackupPasswordStore, BackupExportActivity)
  cryptography: ^2.7.0            # AES-256-GCM + PBKDF2 (IBB1 format, Android jaisa)
  flutter_secure_storage: ^9.2.2  # backup password (Android Keystore / iOS Keychain)
  share_plus: ^10.0.0             # backup / PDF / CSV share
  file_picker: ^8.1.2             # restore: file chunna
  pdf: ^3.11.1                    # PDF report
  printing: ^5.13.1               # PDF print / preview
  open_filex: ^4.5.0              # PDF / CSV kholna

  # Phase 12 — Print & Scan (Kotlin: PrinterHelper, BillPreviewActivity, BillScanActivity)
  print_bluetooth_thermal: ^1.1.4          # 58/80mm Bluetooth ESC/POS printer
  permission_handler: ^11.3.1              # Android 12+ Bluetooth permission
  image_picker: ^1.1.2                     # Bill Scan: camera / gallery
  google_mlkit_text_recognition: ^0.14.0   # Bill Scan: on-device OCR

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
